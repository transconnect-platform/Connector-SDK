name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble, Checkstyle and JavaDoc
        run: ./gradlew --no-daemon assemble checkstyleMain javadoc

      - name: Build the tutorial example
        working-directory: documentation/tutorial-example
        run: sh gradlew --no-daemon assemble
